services:
  database:
    image: "postgres:14"
    restart: unless-stopped
    volumes:
      - ./database:/var/lib/postgresql/data
    networks:
      - network1
    container_name: database
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Not exposed to the host - server/frontend reach it over the Docker
    # network at hostname "database", and each app on the homelab server gets
    # its own Postgres container, so there's nothing host-side to collide on.
    # To connect an external tool (psql/pgAdmin) instead, temporarily add
    # back `ports: ["${DB_PORT}:5432"]` or use `docker exec -it database psql -U postgres`.

  server:
    networks:
      - network1
    build: ./server
    container_name: server
    # `restart: unless-stopped` matters here specifically: on a fresh
    # `database` volume, Postgres's first-time initdb takes a few seconds,
    # and `depends_on: - database` (this bare list form) only waits for the
    # database *container* to start, not for Postgres inside it to actually
    # be ready to accept connections - so `knex migrate:latest` (this
    # image's CMD, before `node src/app.js` runs) can lose that race on
    # first boot and exit with ECONNREFUSED. Without a restart policy that
    # exit is permanent until someone notices and reruns `docker compose up
    # -d` by hand. With it, Compose just retries until the DB is actually
    # ready - confirmed this is a real race, not hypothetical, 2026-09-09.
    restart: unless-stopped
    # Not exposed to the host - reachable only via Caddy, which joins this
    # network (segla_network1 once deployed under /opt/segla) and proxies
    # segla-api.keylimedesigns.dev to this container's PORT. See
    # SERVER_MIGRATION.md's Caddy section. To reach it directly for
    # debugging, temporarily add back `ports: ["${PORT}:${PORT}"]`.
    depends_on:
      - database
    environment:
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING}
      PORT: ${PORT}
    # No bind mount (revised 2026-09-09 - see AUTH.md / SERVER_MIGRATION.md):
    # the image's own COPY'd code and npm-ci'd node_modules are what run
    # now, matching how the frontend service already works. Editing server
    # code requires `docker compose restart server` (or `docker compose up
    # -d --build server` if package.json changed) to pick up the change -
    # no live-reload. For nodemon-based live-reload, run `npm run dev`
    # directly on the host instead of through this container.
    env_file: ".env"

  frontend:
    networks:
      - network1
    build:
      context: ./ui
      args:
        # CRA inlines REACT_APP_* vars at build time, not container start,
        # now that this is a production build (see ui/Dockerfile) - the
        # value has to reach `npm run build` as a build arg, not just an
        # environment/env_file entry the running container would see.
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
    container_name: frontend
    restart: unless-stopped
    # Not exposed to the host - reachable only via Caddy, which joins this
    # network and proxies segla.keylimedesigns.dev to this container's
    # port 4000. See SERVER_MIGRATION.md's Caddy section. To reach it
    # directly for debugging, temporarily add back `ports: ["4000:4000"]`.
    depends_on:
      - server

networks:
  network1:
    driver: bridge
